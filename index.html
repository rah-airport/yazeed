<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>يزيد الشمري</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --surface: #1c2027;
    --surface-hover: #232933;
    --line: #2b313b;
    --text: #e8ebf0;
    --muted: #8a93a1;
    --accent: #6fb7a8;
    --wa: #25d366;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
  }

  /* الصورة العلوية */
  .hero {
    position: relative;
    max-width: 440px;
    margin: 0 auto;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: #222a36;
    display: grid; place-items: center;
  }
  .photo {
    position: absolute;
    left: 0; right: 0;
    top: -12%;
    height: 112%;
    background: #222a36 center top / cover no-repeat;
    will-change: transform;
  }
  .hero svg { position: relative; width: 38%; color: #3a4452; }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 55%, var(--bg));
  }

  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 0 24px 48px;
    animation: appear .7s ease both;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  h1 { position: relative; z-index: 1; margin: -56px 0 6px; font-size: 34px; font-weight: 800; line-height: 1.3; }
  h1 .sep { color: var(--muted); font-weight: 400; margin: 0 4px; }
  .tagline { margin: 0 0 14px; color: var(--accent); font-size: 18px; font-weight: 500; }
  .stats {
    display: inline-block;
    margin: 0 0 18px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }
  .stats b { color: var(--text); font-weight: 800; }

  /* صف الأيقونات */
  .social { list-style: none; margin: 0 0 22px; padding: 0; display: flex; gap: 10px; }
  .social a {
    width: 52px; height: 52px;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease;
  }
  .social svg { width: 24px; height: 24px; fill: currentColor; }
  .social a:hover, .social a:focus-visible { background: var(--surface-hover); color: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
  .social a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .bio { margin: 0 0 30px; color: var(--muted); font-size: 17px; line-height: 1.8; max-width: 30ch; }

  .links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }

  /* زر التعاونات */
  .link {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 18px 24px 18px 20px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--text);
    text-decoration: none;
    font-size: 19px; font-weight: 500;
    transition: background .2s ease, transform .2s ease;
  }
  .link::before {
    content: "";
    position: absolute;
    top: -1px; bottom: -1px; right: -1px;
    width: 5px;
    background: var(--accent);
    transition: width .2s ease;
  }
  .link .ico { flex: none; width: 24px; height: 24px; margin-inline-start: 6px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .link:hover, .link:focus-visible { background: rgba(111,183,168,.12); transform: translateX(-4px); }
  .link:hover::before, .link:focus-visible::before { width: 10px; }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* بطاقة الواتساب */
  .wa-card {
    position: relative;
    display: block;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    transition: background .2s ease, transform .2s ease;
  }
  .wa-card::before {
    content: "";
    position: absolute;
    top: -1px; bottom: -1px; right: -1px;
    width: 5px;
    background: var(--wa);
    transition: width .2s ease;
  }
  .wa-card .stage {
    display: grid; place-items: center;
    aspect-ratio: 16 / 9;
    margin: 12px 12px 4px 17px;
    background: #15241f;
  }
  .wa-card .stage svg { width: 30%; fill: var(--wa); }
  .wa-card .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px 18px 20px; }
  .wa-card .name { font-size: 19px; font-weight: 500; }
  .wa-card .note { color: var(--muted); font-size: 14px; }
  .wa-card:hover, .wa-card:focus-visible { background: var(--surface-hover); transform: translateX(-4px); }
  .wa-card:hover::before, .wa-card:focus-visible::before { width: 10px; }
  .wa-card:focus-visible { outline: 2px solid var(--wa); outline-offset: 3px; }

  footer { margin-top: 36px; color: var(--muted); font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .link, .link::before, .social a, .wa-card, .wa-card::before { transition: none; }
  }
</style>
</head>
